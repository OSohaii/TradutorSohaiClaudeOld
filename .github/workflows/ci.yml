# CI pipeline for MangaLens Translator frontend
# Runs on every PR and push to main
# Validates: type safety, code quality, test suite, production build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # E2E tests (Playwright) are not run in CI because they require a running
      # backend server. Run them locally with: npx playwright test
